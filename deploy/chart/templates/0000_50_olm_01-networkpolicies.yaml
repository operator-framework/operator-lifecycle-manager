apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-traffic
  namespace: {{ .Values.namespace }}
spec:
  podSelector: { }
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: olm-operator
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: olm-operator
  ingress:
    - {{ .Values.networkPolicy.metrics | toYaml | nindent 6 | trimSuffix "\n" }}
  egress:
    - {{ .Values.networkPolicy.kubeAPIServer | toYaml | nindent 6 | trimSuffix "\n" }}
    - {{ .Values.networkPolicy.dns | toYaml | nindent 6 | trimSuffix "\n" }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-operator
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: catalog-operator
  ingress:
    - {{ .Values.networkPolicy.metrics | toYaml | nindent 6 | trimSuffix "\n" }}
  egress:
    - {{ .Values.networkPolicy.kubeAPIServer | toYaml | nindent 6 | trimSuffix "\n" }}
    - {{ .Values.networkPolicy.dns | toYaml | nindent 6 | trimSuffix "\n" }}
    - ports:
      - protocol: TCP
        port: {{ .Values.catalogGrpcPodPort }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: packageserver
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: packageserver
  ingress:
    - ports:
      - protocol: TCP
        port: {{ .Values.package.service.internalPort }}
  egress:
    - {{ .Values.networkPolicy.kubeAPIServer | toYaml | nindent 6 | trimSuffix "\n" }}
    - {{ .Values.networkPolicy.dns | toYaml | nindent 6 | trimSuffix "\n" }}
    - ports:
      - protocol: TCP
        port: {{ .Values.catalogGrpcPodPort }}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-allow-all
  namespace: {{ .Values.operator_namespace }}
spec:
  podSelector: { }
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - { }
  egress:
    - { }
---
# Complements per-CatalogSource NPs from the controller; covers the bootstrapping window before reconciliation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-source-grpc-server
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: olm.catalogSource
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - ports:
      - protocol: TCP
        port: {{ .Values.catalogGrpcPodPort }}
---
# Wildcard egress; API server port omitted intentionally — it is implementation-defined and not statically knowable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bundle-unpack-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: operatorframework.io/bundle-unpack-ref
        operator: Exists
      - key: olm.managed
        operator: In
        values:
          - "true"
  policyTypes:
    - Egress
  egress:
    - { }
